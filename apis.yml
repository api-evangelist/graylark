aid: graylark
name: Graylark
description: >-
  Graylark is an AI-powered geolocation intelligence company serving law
  enforcement, government, and enterprise customers. Its technology extracts
  location data from ordinary images at varying levels of precision, marketed
  under the GeoSpy brand (geospy.ai). The platform offers Global Search (1-50 km
  accuracy with worldwide coverage), Street Search (meter-level precision across
  1,000+ cities), and Property Search (100+ million records for matching a scene
  to a specific structure). Graylark positions these capabilities for
  investigations, fraud detection, insurance validation, and journalistic
  verification of visual content. Access is gated to qualified government and
  enterprise organizations via a contact-sales/licensing model; the company
  publishes no public self-service API, developer documentation, SDKs, or
  OpenAPI at this time. Backed by General Catalyst.
